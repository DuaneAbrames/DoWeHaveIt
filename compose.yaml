services:
  dowehaveit:
    image: ${DOWEHAVEIT_IMAGE:?Set DOWEHAVEIT_IMAGE to ghcr.io/owner/repository:tag}
    platform: linux/amd64
    container_name: dowehaveit
    restart: unless-stopped
    network_mode: bridge
    cpus: ${DOWEHAVEIT_CPUS:-2.0}
    # Optionally set cpuset: "0,1" after selecting logical CPUs on your host.
    stop_grace_period: 40s
    environment:
      TZ: ${TZ:-America/New_York}
      # Start with scheduling disabled; set to 20 after deployment checks.
      SCHEDULE_FREQUENCY: ${SCHEDULE_FREQUENCY:-0}
      SCHEDULE_OFFSET: ${SCHEDULE_OFFSET:-0}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
    volumes:
      - type: bind
        source: ${DOWEHAVEIT_CONFIG:-/mnt/user/appdata/dowehaveit}
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: /mnt
        target: /mnt
        read_only: true
        bind:
          propagation: rslave
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
