name: Container validation and GHCR publication

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Scheduler, mount safety, execution and locking tests
        run: python3 -m unittest discover -s tests -v
      - name: Parse application scripts and container bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('DoWeHaveIt.ps1', 'DoWeHaveIt-UI.ps1', 'DoWeHaveIt-Worker.ps1', 'DoWeHaveIt-Common.ps1', 'container/invoke-worker.ps1')) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - uses: docker/setup-buildx-action@v4
      - name: Build validated AMD64 image (no publication)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dowehaveit:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate runtime, dependencies and absence of application/secrets
        run: |
          docker run --rm --entrypoint bash dowehaveit:test -euc '
            test ! -e /config/DoWeHaveIt-Worker.ps1
            test ! -e /config/database-info.txt
            test ! -e /opt/dowehaveit/DoWeHaveIt-Worker.ps1
            pwsh -NoLogo -NoProfile -Command '\''$ErrorActionPreference="Stop"; Get-Module -ListAvailable SimplySql; Import-Module SimplySql -ErrorAction Stop; Get-Command Open-MySqlConnection -ErrorAction Stop'\''
            python3 /opt/dowehaveit/scheduler.py --check-config
          '
          docker run --rm --entrypoint bash -e SCHEDULE_FREQUENCY=0 dowehaveit:test -euc '
            python3 /opt/dowehaveit/scheduler.py & scheduler=$!
            trap "kill -TERM $scheduler; wait $scheduler" EXIT
            sleep 1
            /opt/dowehaveit/healthcheck
            test ! -e /run/dowehaveit/active.json
          '
      - name: Validate Compose configuration without starting a service
        env:
          DOWEHAVEIT_IMAGE: ghcr.io/example/dowehaveit:test
        run: docker compose config --quiet

  publish:
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'release' && !github.event.release.draft)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Derive lowercase GHCR repository
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'release' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=sha
          labels: |
            org.opencontainers.image.description=DoWeHaveIt Linux inventory worker runtime; application provided by /config
      - name: Publish validated runtime
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Published $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
